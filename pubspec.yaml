name: notoryx_pro
description: "NOTORYX PRO: one app for MeshCore and Meshtastic LoRa radios"
publish_to: 'none'

version: 0.14.0+19

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  path_provider: ^2.1.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.2.2
  crypto: ^3.0.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  drift: ^2.35.3
  sqlite3: ^3.8.0
  universal_ble: ^3.2.0
  # Vendored: the published package's Android build uses jcenter().
  usb_serial:
    path: third_party/usb_serial
  flutter_local_notifications: ^22.3.3
  share_plus: ^13.3.1
  mqtt_client: ^10.14.0
  file_picker: ^13.3.2
  xml: ^7.1.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  # Vendored, Windows only: see third_party/flutter_libserialport/NOTORYX.md.
  flutter_libserialport:
    path: third_party/flutter_libserialport
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
