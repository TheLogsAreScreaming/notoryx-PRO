name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch meshcore-open for comparison
        run: git clone --depth 1 https://github.com/zjs81/meshcore-open.git "$RUNNER_TEMP/meshcore-open"
      - name: Check for meshcore-open code
        run: python3 -I tools/check_independence.py "$RUNNER_TEMP/meshcore-open" .

  platforms:
    # Until the platform folders are committed, generate them here so the
    # native build is checked and the folders can be downloaded and committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform folders
        run: |
          if [ ! -d android ]; then
            flutter create --project-name notoryx_pro --org com.bastionmesh \
              --platforms=android,ios,macos .
            git checkout -- lib test pubspec.yaml analysis_options.yaml
          fi
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: platform-folders
          path: |
            android/
            ios/
            macos/
            pubspec.lock
          retention-days: 7
