name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Lock file is up to date
        run: |
          if ! git diff --quiet -- pubspec.lock; then
            echo "::error::pubspec.lock is out of date; download the pubspec-lock artifact and commit it."
            git diff --stat -- pubspec.lock
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pubspec-lock
          path: pubspec.lock
          retention-days: 3
      - name: Generated database code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded --timeout 30s

  independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch meshcore-open for comparison
        run: git clone --depth 1 https://github.com/zjs81/meshcore-open.git "$RUNNER_TEMP/meshcore-open"
      - name: Check for meshcore-open code
        run: python3 -I tools/check_independence.py "$RUNNER_TEMP/meshcore-open" .

  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Build debug APK (checks the Android project compiles)
        run: flutter build apk --debug

  apple-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Build Mac app (checks entitlements and Xcode project)
        run: flutter build macos --debug
      - name: Build iPhone app without signing
        run: flutter build ios --debug --no-codesign

  windows-build:
    # local_auth_windows 2.0.2 compiles with /await, which Visual Studio 2026
    # (windows-latest) removed; 2022 still accepts it.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --debug
